name = "gilbertanderson-proxy"
main = "worker.js"
compatibility_date = "2026-07-01"

# account_id is deliberately not stored here, because this repo is public.
# Export it before deploying (or let wrangler's OAuth session infer it):
#
#   export CLOUDFLARE_ACCOUNT_ID='...'

# A route rather than a custom domain. The apex already has proxied DNS records
# pointing at Cloudflare, and custom_domain mode insists on creating records it
# owns, so it refuses to attach to a hostname that already has them (API error
# 100117). A route binds to the existing proxied record instead.
#
# The /* suffix is required; a bare hostname is custom-domain syntax. zone_name
# tells wrangler which zone the pattern belongs to.
#
# www is intentionally absent: it currently has no DNS record, so a route there
# would not resolve. Add a proxied CNAME (www -> gilbertanderson.com) first.
routes = [
  { pattern = "gilbertanderson.com/*", zone_name = "gilbertanderson.com" },
]
